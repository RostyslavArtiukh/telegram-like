groups:
  - name: telegramlike-availability
    rules:
      # Any scraped app (service / gateway / web) has been unreachable for >1m.
      - alert: TargetDown
        expr: up{job!="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.job }} is down"
          description: "Prometheus could not scrape {{ $labels.job }} ({{ $labels.instance }}) for over 1 minute."

  - name: telegramlike-http
    rules:
      # >5% of a service's responses are 5xx over the last 5m. Zero-traffic services
      # have a 0 numerator, so this only fires on real, sustained server errors.
      - alert: HighHttp5xxRate
        expr: |
          sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
            /
          sum by (job) (rate(http_server_request_duration_seconds_count[5m]))
            > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate on {{ $labels.job }}"
          description: "{{ $labels.job }} is returning {{ $value | humanizePercentage }} 5xx responses (>5%)."

      # p95 request latency above 1.5s for 5m — the service is alive but slow.
      - alert: HighRequestLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (job, le) (rate(http_server_request_duration_seconds_bucket[5m]))
          ) > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.job }}"
          description: "p95 request latency on {{ $labels.job }} is {{ $value | humanizeDuration }} (>1.5s)."

  - name: telegramlike-outbox
    rules:
      # Age of the head of the queue, not its depth: a deep queue that drains is fine,
      # a shallow one whose oldest row keeps aging is stuck. The sender polls every
      # OutgoingEvents:PollIntervalSeconds, so a healthy head is a few seconds old.
      - alert: OutboxStalled
        expr: telegramlike_outbox_oldest_pending_age_seconds > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Outbox is not draining on {{ $labels.job }}"
          description: "The oldest unpublished event on {{ $labels.job }} is {{ $value | humanizeDuration }} old — integration events are not reaching the broker."

      # Dead-lettered events are silent data loss: consumers never see them and nothing
      # retries. Any sustained increase deserves a look.
      - alert: OutboxDeadLettering
        expr: increase(telegramlike_outbox_dead_lettered_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Outbox dead-lettered events on {{ $labels.job }}"
          description: "{{ $labels.job }} gave up publishing {{ $value }} {{ $labels.event_type }} event(s) in the last 10m."
