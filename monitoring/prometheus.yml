global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Alerting rules are evaluated every evaluation_interval; firing alerts are pushed
# to Alertmanager, which groups/routes them.
rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# One job per app; the `job` label distinguishes services in the dashboards.
# All apps listen on :8080 inside the compose network and expose /metrics.
scrape_configs:
  - job_name: identity
    static_configs: [{ targets: ['identity:8080'] }]
  - job_name: notifications
    static_configs: [{ targets: ['notifications:8080'] }]
  - job_name: presence
    static_configs: [{ targets: ['presence:8080'] }]
  - job_name: chats
    static_configs: [{ targets: ['chats:8080'] }]
  - job_name: messaging
    static_configs: [{ targets: ['messaging:8080'] }]
  - job_name: realtime
    static_configs: [{ targets: ['realtime:8080'] }]
  - job_name: gateway
    static_configs: [{ targets: ['gateway:8080'] }]
  - job_name: web
    static_configs: [{ targets: ['web:8080'] }]
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]

  # RabbitMQ ships the rabbitmq_prometheus plugin on :15692, enabled by default in the
  # official image. Two jobs because the broker exposes two shapes of the same data:
  #   /metrics          — cluster-wide aggregates, cheap, no per-queue labels
  #   /metrics/detailed — per-object series, which is what makes "which queue is backing
  #                       up" answerable. Restricted to the queue family on purpose;
  #                       asking for everything multiplies series by every connection
  #                       and channel.
  - job_name: rabbitmq
    static_configs: [{ targets: ['rabbitmq:15692'] }]

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs: [{ targets: ['rabbitmq:15692'] }]
