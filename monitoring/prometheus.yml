global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Alerting rules are evaluated every evaluation_interval; firing alerts are pushed
# to Alertmanager, which groups/routes them.
rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# One job per app; the `job` label distinguishes services in the dashboards.
# All apps listen on :8080 inside the compose network and expose /metrics.
scrape_configs:
  - job_name: identity
    static_configs: [{ targets: ['identity:8080'] }]
  - job_name: notifications
    static_configs: [{ targets: ['notifications:8080'] }]
  - job_name: presence
    static_configs: [{ targets: ['presence:8080'] }]
  - job_name: chats
    static_configs: [{ targets: ['chats:8080'] }]
  - job_name: messaging
    static_configs: [{ targets: ['messaging:8080'] }]
  - job_name: gateway
    static_configs: [{ targets: ['gateway:8080'] }]
  - job_name: web
    static_configs: [{ targets: ['web:8080'] }]
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]
