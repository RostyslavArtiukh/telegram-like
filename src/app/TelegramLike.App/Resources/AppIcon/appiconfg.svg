    <path d="M180 262 L150 334 L240 268 Z" fill="#ffffff" />
    <rect x="112" y="116" width="232" height="156" rx="42" fill="#ffffff" />
    <rect x="146" y="152" width="172" height="20" rx="10" fill="#2b7de9" />
    <rect x="146" y="188" width="142" height="20" rx="10" fill="#2b7de9" />
    <rect x="146" y="224" width="104" height="20" rx="10" fill="#2b7de9" />
</svg>
