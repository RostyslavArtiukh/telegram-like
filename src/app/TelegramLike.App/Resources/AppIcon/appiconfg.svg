<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Messenger glyph: a white speech bubble with lines of text, so the app
     reads as a chat app rather than the default .NET logo. The text lines use
     the background colour so they look cut out of the bubble. -->
