<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TelegramLike.App</title>
    <base href="/" />

    <!-- MudBlazor drives the whole UI now; Bootstrap has been dropped. Roboto loads
         from Google when online and falls back to the system font otherwise. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="TelegramLike.App.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <script>
        // Pin a scrollable element to its newest content (used by the chat view
        // to keep the latest message in view on load and on every new message).
        window.telegramLike = {
            scrollToBottom: function (element) {
                if (element) { element.scrollTop = element.scrollHeight; }
            }
        };
    </script>

</body>

</html>
