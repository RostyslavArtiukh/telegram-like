name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & test
    # ubuntu-latest ships with Docker, which the Testcontainers-based
    # Infrastructure/Api integration tests require.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore TelegramLike.sln

      - name: Build
        run: dotnet build TelegramLike.sln -c Release --no-restore

      - name: Test
        run: dotnet test TelegramLike.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  build-maui:
    name: Build MAUI app (Windows)
    # The MAUI app targets a Windows TFM and is excluded from TelegramLike.sln (the
    # ubuntu build-test job above). Nothing else compiles it, so an SDK signature
    # change or a Razor break in src/app goes undetected until a manual build. This
    # job compile-checks TelegramLike.App.slnx so that drift surfaces in CI. No tests
    # (there are none for the app; its logic is covered via the SDK).
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # net9 for the referenced SDK/Contracts projects; net10 SDK to build the
          # app's net10.0-windows target framework.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install MAUI (Windows) workload
        run: dotnet workload install maui-windows

      # Build the Windows TFM of the app project directly (not the .slnx): the .slnx
      # also carries a net10.0-android TFM, and CI only installs the maui-windows
      # workload. Building the csproj still compile-checks the app + its SDK/Contracts
      # references, which is the drift check we want.
      #
      # No separate `dotnet restore` + `--no-restore`: the app is an unpackaged,
      # self-contained Windows app (WindowsPackageType=None), so the MAUI build sets a
      # win-x64 RuntimeIdentifier that a RID-less restore never sees — leaving the
      # CoreCLR win-x64 runtime pack unrestored (NETSDK1112). Letting `build` do its own
      # restore fetches that pack with the correct RID.
      - name: Build (Windows TFM)
        run: dotnet build src/app/TelegramLike.App/TelegramLike.App.csproj -c Release -f net10.0-windows10.0.19041.0
