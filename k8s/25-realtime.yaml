apiVersion: v1
kind: Service
metadata:
  name: realtime
  namespace: telegramlike
  labels:
    app: realtime
spec:
  selector:
    app: realtime
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime
  namespace: telegramlike
spec:
  # SignalR hub — no DB. Consumes integration events on per-instance queues, so each
  # replica sees every event; safe to scale. (Mirrors the docker-compose realtime svc.)
  replicas: 1
  selector:
    matchLabels:
      app: realtime
  template:
    metadata:
      labels:
        app: realtime
    spec:
      containers:
        - name: realtime
          image: telegramlike-realtime:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
