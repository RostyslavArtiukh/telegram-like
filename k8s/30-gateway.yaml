apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: telegramlike
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: telegramlike
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: telegramlike-gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Tracing__OtlpEndpoint
              value: "http://jaeger:4317"
            # YARP destinations — each service Service, all listen on :8080.
            - name: ReverseProxy__Clusters__identity__Destinations__d1__Address
              value: "http://identity:8080"
            - name: ReverseProxy__Clusters__notifications__Destinations__d1__Address
              value: "http://notifications:8080"
            - name: ReverseProxy__Clusters__presence__Destinations__d1__Address
              value: "http://presence:8080"
            - name: ReverseProxy__Clusters__chats__Destinations__d1__Address
              value: "http://chats:8080"
            - name: ReverseProxy__Clusters__messaging__Destinations__d1__Address
              value: "http://messaging:8080"
            - name: ReverseProxy__Clusters__realtime__Destinations__d1__Address
              value: "http://realtime:8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
