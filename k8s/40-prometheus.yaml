# prometheus.yml + rules.yml come from the `prometheus-config` ConfigMap
# generated by kustomize from monitoring/. Targets (identity:8080, web:8080, …)
# resolve via in-namespace Service DNS, unchanged from compose.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: telegramlike
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: telegramlike
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
