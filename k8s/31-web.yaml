# Web BFF (Blazor Server). Exposed via NodePort 30080 for the browser
# (http://localhost:30080). DataProtection keys are persisted to a PVC so
# auth cookies survive pod restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-dp-keys
  namespace: telegramlike
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: telegramlike
  labels:
    app: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: telegramlike
spec:
  # >1 replica works because (a) the sticky-session Ingress pins each browser's
  # Blazor circuit to one pod, and (b) each pod gets its own auto-delete RabbitMQ
  # queues so every replica receives every real-time event (see Web/Program.cs).
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: telegramlike-web:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: RabbitMQ__Host
              value: rabbitmq
            - name: RabbitMQ__Username
              value: guest
            - name: RabbitMQ__Password
              value: guest
            - name: RabbitMQ__VirtualHost
              value: telegramlike
            - name: Tracing__OtlpEndpoint
              value: "http://jaeger:4317"
            - name: Gateway__BaseUrl
              value: "http://gateway:8080"
            - name: DataProtection__KeysPath
              value: /var/dp-keys
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: dp-keys
              mountPath: /var/dp-keys
          readinessProbe:
            # Ready = the RabbitMQ bus is connected (MassTransit "ready"-tagged check).
            # The gateway is deliberately not part of readiness — downstream outage is
            # absorbed by the SDK resilience pipeline + graceful degradation.
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: dp-keys
          persistentVolumeClaim:
            claimName: web-dp-keys
