apiVersion: v1
kind: Service
metadata:
  name: presence
  namespace: telegramlike
  labels:
    app: presence
spec:
  selector:
    app: presence
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presence
  namespace: telegramlike
spec:
  replicas: 1
  selector:
    matchLabels:
      app: presence
  template:
    metadata:
      labels:
        app: presence
    spec:
      containers:
        - name: presence
          image: telegramlike-presence:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: MongoDB__DatabaseName
              value: telegramlike_presence
            - name: Redis__ConnectionString
              value: "redis:6379"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
