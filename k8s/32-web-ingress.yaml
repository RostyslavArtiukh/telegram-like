# Sticky-session ingress for the Web BFF. Blazor Server holds each browser's
# circuit (component state + the SignalR WebSocket) in memory on ONE pod, so the
# load balancer must always route a given browser back to the same pod — cookie
# affinity does that. Without it, a reconnect could land on another pod and the
# circuit would be lost ("Attempting to reconnect…").
#
# Needs an ingress controller (ingress-nginx). Access: http://localhost/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: telegramlike
  annotations:
    # Cookie-based session affinity → pins the browser to one web pod.
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "tl-affinity"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    # Blazor's circuit is a long-lived WebSocket — keep the proxy connection open.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
