# Env shared by all five services (and, where noted, gateway/web). Per-service
# values (MongoDB__DatabaseName, Redis) are set inline on each Deployment.
# Service DNS names match the docker-compose service names so the connection
# strings, gateway destinations and prometheus targets carry over unchanged.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: telegramlike
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  MongoDB__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true"
  RabbitMQ__Host: "rabbitmq"
  RabbitMQ__Username: "guest"
  RabbitMQ__Password: "guest"
  RabbitMQ__VirtualHost: "telegramlike"
  Tracing__OtlpEndpoint: "http://jaeger:4317"
  ServiceAuth__Issuer: "telegramlike-identity"
  ServiceAuth__Audience: "telegramlike-services"
