services:
  mongodb:
    image: mongo:7
    container_name: telegramlike-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]});
        }"
      interval: 10s
      start_period: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: telegramlike-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

  jaeger:
    # all-in-one bundles collector + storage + UI. Accepts OTLP gRPC on 4317
    # and serves the UI on 16686. Memory-only storage — fine for local dev.
    image: jaegertracing/all-in-one:1.60
    container_name: telegramlike-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: telegramlike-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # Namespace TelegramLike traffic in its own vhost so the broker stays
      # tidy if another app shares it. True per-service vhosts would need
      # shovel/federation and break cross-service routing — out of scope.
      RABBITMQ_DEFAULT_VHOST: telegramlike
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      start_period: 20s
      retries: 10

  notifications:
    build:
      context: .
      dockerfile: src/services/notifications/TelegramLike.Notifications.Api/Dockerfile
    image: telegramlike-notifications:latest
    container_name: telegramlike-notifications
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      start_period: 20s
      retries: 5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDB__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true"
      MongoDB__DatabaseName: telegramlike_notifications
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__VirtualHost: telegramlike
      Tracing__OtlpEndpoint: "http://jaeger:4317"
      ServiceAuth__JwtSecret: "2VfJYDFDbVxHRbBk0EgRPtdAAdXbENPFUbq0TNrBWOOBsljtAU1IwhBt4PPcYkj2"
      ServiceAuth__Issuer: telegramlike-identity
      ServiceAuth__Audience: telegramlike-services

  presence:
    build:
      context: .
      dockerfile: src/services/presence/TelegramLike.Presence.Api/Dockerfile
    image: telegramlike-presence:latest
    container_name: telegramlike-presence
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      start_period: 20s
      retries: 5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDB__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true"
      MongoDB__DatabaseName: telegramlike_presence
      Redis__ConnectionString: "redis:6379"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__VirtualHost: telegramlike
      Tracing__OtlpEndpoint: "http://jaeger:4317"
      ServiceAuth__JwtSecret: "2VfJYDFDbVxHRbBk0EgRPtdAAdXbENPFUbq0TNrBWOOBsljtAU1IwhBt4PPcYkj2"
      ServiceAuth__Issuer: telegramlike-identity
      ServiceAuth__Audience: telegramlike-services

  chats:
    build:
      context: .
      dockerfile: src/services/chats/TelegramLike.Chats.Api/Dockerfile
    image: telegramlike-chats:latest
    container_name: telegramlike-chats
    restart: unless-stopped
    ports:
      - "8083:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      start_period: 20s
      retries: 5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDB__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true"
      MongoDB__DatabaseName: telegramlike_chats
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__VirtualHost: telegramlike
      Tracing__OtlpEndpoint: "http://jaeger:4317"
      ServiceAuth__JwtSecret: "2VfJYDFDbVxHRbBk0EgRPtdAAdXbENPFUbq0TNrBWOOBsljtAU1IwhBt4PPcYkj2"
      ServiceAuth__Issuer: telegramlike-identity
      ServiceAuth__Audience: telegramlike-services

  messaging:
    build:
      context: .
      dockerfile: src/services/messaging/TelegramLike.Messaging.Api/Dockerfile
    image: telegramlike-messaging:latest
    container_name: telegramlike-messaging
    restart: unless-stopped
    ports:
      - "8084:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      start_period: 20s
      retries: 5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDB__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true"
      MongoDB__DatabaseName: telegramlike_messaging
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__VirtualHost: telegramlike
      Tracing__OtlpEndpoint: "http://jaeger:4317"
      ServiceAuth__JwtSecret: "2VfJYDFDbVxHRbBk0EgRPtdAAdXbENPFUbq0TNrBWOOBsljtAU1IwhBt4PPcYkj2"
      ServiceAuth__Issuer: telegramlike-identity
      ServiceAuth__Audience: telegramlike-services

  identity:
    build:
      context: .
      dockerfile: src/services/identity/TelegramLike.Identity.Api/Dockerfile
    image: telegramlike-identity:latest
    container_name: telegramlike-identity
    restart: unless-stopped
    ports:
      - "8085:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      start_period: 20s
      retries: 5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDB__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true"
      MongoDB__DatabaseName: telegramlike_identity
      Redis__ConnectionString: "redis:6379"
      Auth__SessionTokenTtlDays: "7"
      Tracing__OtlpEndpoint: "http://jaeger:4317"
      # Identity is the IdP: it signs the access tokens (issuer=telegramlike-identity)
      # that every other service validates.
      ServiceAuth__JwtSecret: "2VfJYDFDbVxHRbBk0EgRPtdAAdXbENPFUbq0TNrBWOOBsljtAU1IwhBt4PPcYkj2"
      ServiceAuth__Issuer: telegramlike-identity
      ServiceAuth__Audience: telegramlike-services
      ServiceAuth__TokenLifetimeSeconds: "300"

  web:
    build:
      context: .
      dockerfile: src/TelegramLike.Web/Dockerfile
    image: telegramlike-web:latest
    container_name: telegramlike-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      notifications:
        condition: service_healthy
      presence:
        condition: service_healthy
      chats:
        condition: service_healthy
      messaging:
        condition: service_healthy
      identity:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__VirtualHost: telegramlike
      Tracing__OtlpEndpoint: "http://jaeger:4317"
      NotificationsApi__BaseUrl: "http://notifications:8080"
      PresenceApi__BaseUrl: "http://presence:8080"
      ChatsApi__BaseUrl: "http://chats:8080"
      MessagingApi__BaseUrl: "http://messaging:8080"
      IdentityApi__BaseUrl: "http://identity:8080"
      DataProtection__KeysPath: /var/dp-keys
    volumes:
      - web_dp_keys:/var/dp-keys

volumes:
  mongo_data:
  web_dp_keys:
