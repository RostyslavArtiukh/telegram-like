services:
  mongodb:
    image: mongo:7
    container_name: telegramlike-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]});
        }"
      interval: 10s
      start_period: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: telegramlike-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

  jaeger:
    # all-in-one bundles collector + storage + UI. Accepts OTLP gRPC on 4317
    # and serves the UI on 16686. Memory-only storage — fine for local dev.
    image: jaegertracing/all-in-one:1.60
    container_name: telegramlike-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    # Scrapes /metrics on every app (config lists each as a job). Pull-based,
    # so it just retries until an app is up — no depends_on needed.
    image: prom/prometheus:v2.55.1
    container_name: telegramlike-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  alertmanager:
    # Receives firing alerts from Prometheus; groups/routes them. No external
    # notifier configured locally — alerts are visible in its UI (:9093).
    image: prom/alertmanager:v0.27.0
    container_name: telegramlike-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml

  grafana:
    # Auto-provisioned: Prometheus datasource + the "Services Overview" dashboard.
    # Anonymous viewing on so the dashboard opens without a login (admin/admin to edit).
    image: grafana/grafana:11.3.0
    container_name: telegramlike-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  rabbitmq:
    image: rabbitmq:3-management
    container_name: telegramlike-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # Namespace TelegramLike traffic in its own vhost so the broker stays
      # tidy if another app shares it. True per-service vhosts would need
      # shovel/federation and break cross-service routing — out of scope.
      RABBITMQ_DEFAULT_VHOST: telegramlike
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      start_period: 20s
      retries: 10

  notifications:
    build:
      context: .
      dockerfile: src/services/notifications/TelegramLike.Notifications.Api/Dockerfile
    image: telegramlike-notifications:latest
    container_name: telegramlike-notifications
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      start_period: 20s
      retries: 5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDB__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true"
      MongoDB__DatabaseName: telegramlike_notifications
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__VirtualHost: telegramlike
      Tracing__OtlpEndpoint: "http://jaeger:4317"
      ServiceAuth__JwtSecret: "2VfJYDFDbVxHRbBk0EgRPtdAAdXbENPFUbq0TNrBWOOBsljtAU1IwhBt4PPcYkj2"
      ServiceAuth__Issuer: telegramlike-identity
      ServiceAuth__Audience: telegramlike-services

  presence:
    build:
      context: .
      dockerfile: src/services/presence/TelegramLike.Presence.Api/Dockerfile
    image: telegramlike-presence:latest
    container_name: telegramlike-presence
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      start_period: 20s
      retries: 5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDB__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true"
      MongoDB__DatabaseName: telegramlike_presence
      Redis__ConnectionString: "redis:6379"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__VirtualHost: telegramlike
      Tracing__OtlpEndpoint: "http://jaeger:4317"
      ServiceAuth__JwtSecret: "2VfJYDFDbVxHRbBk0EgRPtdAAdXbENPFUbq0TNrBWOOBsljtAU1IwhBt4PPcYkj2"
      ServiceAuth__Issuer: telegramlike-identity
      ServiceAuth__Audience: telegramlike-services

  chats:
    build:
      context: .
      dockerfile: src/services/chats/TelegramLike.Chats.Api/Dockerfile
    image: telegramlike-chats:latest
    container_name: telegramlike-chats
    restart: unless-stopped
    ports:
      - "8083:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      start_period: 20s
      retries: 5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDB__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true"
      MongoDB__DatabaseName: telegramlike_chats
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__VirtualHost: telegramlike
      Tracing__OtlpEndpoint: "http://jaeger:4317"
      ServiceAuth__JwtSecret: "2VfJYDFDbVxHRbBk0EgRPtdAAdXbENPFUbq0TNrBWOOBsljtAU1IwhBt4PPcYkj2"
      ServiceAuth__Issuer: telegramlike-identity
      ServiceAuth__Audience: telegramlike-services

  messaging:
    build:
      context: .
      dockerfile: src/services/messaging/TelegramLike.Messaging.Api/Dockerfile
    image: telegramlike-messaging:latest
    container_name: telegramlike-messaging
    restart: unless-stopped
    ports:
      - "8084:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      start_period: 20s
      retries: 5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDB__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true"
      MongoDB__DatabaseName: telegramlike_messaging
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__VirtualHost: telegramlike
      Tracing__OtlpEndpoint: "http://jaeger:4317"
      ServiceAuth__JwtSecret: "2VfJYDFDbVxHRbBk0EgRPtdAAdXbENPFUbq0TNrBWOOBsljtAU1IwhBt4PPcYkj2"
      ServiceAuth__Issuer: telegramlike-identity
      ServiceAuth__Audience: telegramlike-services

  identity:
    build:
      context: .
      dockerfile: src/services/identity/TelegramLike.Identity.Api/Dockerfile
    image: telegramlike-identity:latest
    container_name: telegramlike-identity
    restart: unless-stopped
    ports:
      - "8085:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      start_period: 20s
      retries: 5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDB__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true"
      MongoDB__DatabaseName: telegramlike_identity
      Redis__ConnectionString: "redis:6379"
      Auth__SessionTokenTtlDays: "7"
      Tracing__OtlpEndpoint: "http://jaeger:4317"
      # Identity is the IdP: it signs the access tokens (issuer=telegramlike-identity)
      # that every other service validates.
      ServiceAuth__JwtSecret: "2VfJYDFDbVxHRbBk0EgRPtdAAdXbENPFUbq0TNrBWOOBsljtAU1IwhBt4PPcYkj2"
      ServiceAuth__Issuer: telegramlike-identity
      ServiceAuth__Audience: telegramlike-services
      ServiceAuth__TokenLifetimeSeconds: "300"

  realtime:
    build:
      context: .
      dockerfile: src/services/realtime/TelegramLike.Realtime.Api/Dockerfile
    image: telegramlike-realtime:latest
    container_name: telegramlike-realtime
    restart: unless-stopped
    ports:
      - "8086:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      start_period: 20s
      retries: 5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__VirtualHost: telegramlike
      Tracing__OtlpEndpoint: "http://jaeger:4317"
      ServiceAuth__JwtSecret: "2VfJYDFDbVxHRbBk0EgRPtdAAdXbENPFUbq0TNrBWOOBsljtAU1IwhBt4PPcYkj2"
      ServiceAuth__Issuer: telegramlike-identity
      ServiceAuth__Audience: telegramlike-services

  gateway:
    build:
      context: .
      dockerfile: src/gateway/TelegramLike.Gateway/Dockerfile
    image: telegramlike-gateway:latest
    container_name: telegramlike-gateway
    restart: unless-stopped
    ports:
      - "8090:8080"
    depends_on:
      notifications:
        condition: service_healthy
      presence:
        condition: service_healthy
      chats:
        condition: service_healthy
      messaging:
        condition: service_healthy
      identity:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      start_period: 10s
      retries: 5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Tracing__OtlpEndpoint: "http://jaeger:4317"
      ReverseProxy__Clusters__identity__Destinations__d1__Address: "http://identity:8080"
      ReverseProxy__Clusters__notifications__Destinations__d1__Address: "http://notifications:8080"
      ReverseProxy__Clusters__presence__Destinations__d1__Address: "http://presence:8080"
      ReverseProxy__Clusters__chats__Destinations__d1__Address: "http://chats:8080"
      ReverseProxy__Clusters__messaging__Destinations__d1__Address: "http://messaging:8080"
      ReverseProxy__Clusters__realtime__Destinations__d1__Address: "http://realtime:8080"

  web:
    build:
      context: .
      dockerfile: src/TelegramLike.Web/Dockerfile
    image: telegramlike-web:latest
    container_name: telegramlike-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      gateway:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__VirtualHost: telegramlike
      Tracing__OtlpEndpoint: "http://jaeger:4317"
      Gateway__BaseUrl: "http://gateway:8080"
      DataProtection__KeysPath: /var/dp-keys
    volumes:
      - web_dp_keys:/var/dp-keys

volumes:
  mongo_data:
  web_dp_keys:
